# Render 무료 플랜은 일정 시간 요청이 없으면 슬립 상태로 전환됨(콜드스타트) → 10분마다 헬스체크를 호출해서 깨어있게 유지
name: Render 콜드스타트 방지

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 백엔드 헬스체크 핑
        run: curl -sf "${{ vars.RENDER_BACKEND_URL }}/api/health" || echo "핑 실패 (배포 전이거나 서버가 재기동 중일 수 있음)"
