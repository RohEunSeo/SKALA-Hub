# SKALA Hub 백엔드 설정 - 모든 값은 환경변수로 주입 (하드코딩 금지)
spring:
  application:
    name: skala-hub-backend
  datasource:
    url: jdbc:postgresql://aws-1-ap-northeast-2.pooler.supabase.com:5432/postgres
    username: postgres.xbnycvcclaklwqgmzxwb
    password: ${SUPABASE_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Slack 연동
slack:
  client-id: ${SLACK_CLIENT_ID}
  client-secret: ${SLACK_CLIENT_SECRET}
  user-token: ${SLACK_USER_TOKEN}
  channel-id: ${SLACK_CHANNEL_ID}

# Claude API (게시글 자동 분류)
claude:
  api-key: ${CLAUDE_API_KEY}

# JWT 인증
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
