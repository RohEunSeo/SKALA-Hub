# SKALA Hub 백엔드 설정 - 모든 값은 환경변수로 주입 (하드코딩 금지)
# 테스트 모드 - true면 슬랙 봇 댓글을 실제로 전송하지 않고 콘솔 로그만 출력
test-mode: ${TEST_MODE:false}

server:
  # Render는 PORT 환경변수로 리스닝 포트를 지정함 - 로컬 개발은 SERVER_PORT 또는 기본값 8080 사용
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  application:
    name: skala-hub-backend
  datasource:
    # Transaction 모드 풀러(6543) 사용 - Session 모드(5432)는 동시접속 제한(max clients)에 쉽게 걸림
    # prepareThreshold=0: PgBouncer transaction 모드는 커넥션이 트랜잭션마다 바뀔 수 있어 서버사이드 prepared statement 캐싱을 끔
    url: jdbc:postgresql://aws-1-ap-northeast-2.pooler.supabase.com:6543/postgres?prepareThreshold=0
    username: postgres.xbnycvcclaklwqgmzxwb
    password: ${SUPABASE_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Slack 연동
slack:
  client-id: ${SLACK_CLIENT_ID}
  client-secret: ${SLACK_CLIENT_SECRET}
  user-token: ${SLACK_USER_TOKEN}
  bot-token: ${SLACK_BOT_TOKEN:}
  channel-id: ${SLACK_CHANNEL_ID}
  redirect-uri: ${SLACK_REDIRECT_URI:http://localhost:8080/api/auth/slack/callback}
  # Event Subscriptions 요청 서명 검증용 (api.slack.com 앱 → Basic Information → Signing Secret)
  signing-secret: ${SLACK_SIGNING_SECRET:}
  # 관리자 개인 DM 알림을 받을 Slack 멤버 ID (U로 시작) - 미설정 시 DM 전송은 조용히 스킵됨
  admin-dm-user-id: ${SLACK_ADMIN_DM_USER_ID:}
  # 최근 N일 이내 글만 재조회하는 증분 동기화 주기 - 5분이 적당한 절충점
  sync-interval-ms: ${SLACK_SYNC_INTERVAL_MS:300000}
  # 증분 동기화가 다시 훑는 범위 - 이 기간 안에서는 새 글/댓글/반응수/수정이 모두 5분마다 반영됨
  sync-recent-window-days: ${SLACK_SYNC_RECENT_WINDOW_DAYS:7}
  # 채널 전체(옛 글 포함)를 처음부터 다시 훑는 전체 재동기화 주기 - 새벽 4시(한산한 시간)
  full-sync-cron: ${SLACK_FULL_SYNC_CRON:0 0 4 * * *}
  workspace-url: ${SLACK_WORKSPACE_URL:https://theskala.slack.com}

# Claude API (게시글 자동 분류)
claude:
  api-key: ${CLAUDE_API_KEY}
  model: ${CLAUDE_MODEL:claude-haiku-4-5}

# OpenWeather API (대시보드 판교 날씨 위젯)
openweather:
  api-key: ${OPENWEATHER_API_KEY}

# JWT 인증
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

# 프론트엔드 (OAuth 로그인 완료 후 리다이렉트 대상)
app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  # 홈 화면 "SKALA N기 D일째" 계산 기준일
  cohort-start-date: ${SKALA_COHORT_START_DATE:2026-07-14}
  # 대시보드 "D-day"/게시글 기여도 히트맵 계산 기준일 (교육 종료일)
  cohort-end-date: ${SKALA_COHORT_END_DATE:2026-12-18}
