# SKALA Hub 백엔드 설정 - 모든 값은 환경변수로 주입 (하드코딩 금지)
spring.application.name=skala-hub-backend

# Supabase(PostgreSQL) 연결 - Supabase 대시보드의 Connection string(JDBC) 값 사용
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=postgres
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Slack 연동
slack.client-id=${SLACK_CLIENT_ID}
slack.client-secret=${SLACK_CLIENT_SECRET}
slack.user-token=${SLACK_USER_TOKEN}
slack.channel-id=${SLACK_CHANNEL_ID}

# Claude API (게시글 자동 분류)
claude.api-key=${CLAUDE_API_KEY}

# JWT 인증
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
